name: AI PR Review

on:
  pull_request:
    types:
      - opened
      - reopened
  # Manual re-trigger (avoids burning API calls on every push)
  workflow_dispatch:

# Prevent parallel reviews for the same PR (avoids Gemini rate-limit races)
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get PR Context
        id: pr-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE_ENV: ${{ github.event.pull_request.title }}
          PR_BODY_ENV: ${{ github.event.pull_request.body }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "BASE_REF=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
            printf '%s' "$PR_TITLE_ENV" > pr_title.txt
            printf '%s' "$PR_BODY_ENV"  > pr_body.txt
          else
            echo "Fetching PR details for branch: $GITHUB_REF_NAME"
            PR_JSON=$(gh pr view "$GITHUB_REF_NAME" --json baseRefName,number,title,body || echo "")
            if [ -z "$PR_JSON" ]; then
              echo "Error: No open PR found for branch $GITHUB_REF_NAME. Cannot run review."
              exit 1
            fi
            echo "BASE_REF=$(echo "$PR_JSON" | jq -r .baseRefName)" >> $GITHUB_ENV
            echo "PR_NUMBER=$(echo "$PR_JSON" | jq -r .number)" >> $GITHUB_ENV
            echo "$PR_JSON" | jq -r .title > pr_title.txt
            echo "$PR_JSON" | jq -r .body > pr_body.txt
          fi

      # ── 1. Get PR Diff ────────────────────────────────────────────────────
      - name: Get PR Diff
        run: |
          git fetch origin $BASE_REF

          git diff \
            origin/$BASE_REF...HEAD \
            -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)yarn.lock' \
            ':(exclude)dist/**' \
            ':(exclude)coverage/**' \
            ':(exclude)generated/**' \
            ':(exclude)node_modules/**' \
            ':(exclude)*.test.ts' \
            ':(exclude)*.spec.ts' \
            ':(exclude)test/**' \
            > diff.txt

          # Guard against oversized diffs (Gemini context limit)
          MAX_BYTES=900000   # ~900 KB — leaves room for the surrounding prompt
          ACTUAL_BYTES=$(wc -c < diff.txt)
          echo "Diff size: ${ACTUAL_BYTES} bytes"

          if [ "$ACTUAL_BYTES" -gt "$MAX_BYTES" ]; then
            echo "Diff exceeds ${MAX_BYTES} bytes — truncating to avoid context overflow"
            head -c "$MAX_BYTES" diff.txt > diff_trimmed.txt
            printf '\n\n... (diff truncated — PR is too large for a full review)\n' >> diff_trimmed.txt
            mv diff_trimmed.txt diff.txt
          fi

      # ── 2. Generate Prompt ────────────────────────────────────────────────
      # SECURITY: PR title and body are written via env vars — never interpolated
      # directly into shell strings — to prevent command/heredoc injection.
      - name: Generate Prompt
        run: |
          # pr_title.txt and pr_body.txt are already created by the Get PR Context step

          cat <<'HEADER' > prompt_header.txt
          You are a senior NestJS backend engineer.

          Review this Pull Request.

          Repository Stack:
          - NestJS
          - Prisma
          - PostgreSQL
          - TypeScript

          Look specifically for:
          - NestJS dependency injection issues
          - Prisma query mistakes
          - N+1 queries
          - Missing transactions for multi-step writes
          - DTO validation
          - Guards
          - Interceptors
          - Exception filters
          - SQL performance and PostgreSQL indexes
          - Breaking API changes
          - Swagger changes

          If the diff is trivial (e.g. only version bumps, comment changes, or
          whitespace), respond with a one-line summary and skip unused sections.

          Please generate a review with the following sections. Output MUST be valid Markdown.

          ## 🤖 AI Summary & Walkthrough
          Provide a high-level summary of what this PR accomplishes.

          ### 🗺️ Architecture / Flow Diagram
          Generate a Mermaid.js `graph TD` or `sequenceDiagram` that visualizes the changes in this PR. 
          Use valid mermaid syntax enclosed in ```mermaid code blocks.

          ### 📂 File Walkthrough
          Provide a bulleted list explaining the key changes file-by-file.

          ### 🔍 Code Review
          Include the following subsections for your code review:
          - **Major Changes**
          - **Potential Bugs**
          - **Security Concerns**
          - **Performance Concerns**
          - **Maintainability**
          - **Suggested Improvements**

          Pull Request Title:
          HEADER

          # Concatenate: static header + dynamic title + static separator + dynamic body + diff
          {
            cat prompt_header.txt
            cat pr_title.txt
            printf '\n\nDescription:\n'
            cat pr_body.txt
            printf '\n\nGit Diff:\n'
            cat diff.txt
          } > prompt.txt

      # ── 3. Call Gemini ────────────────────────────────────────────────────
      - name: Call Gemini
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # jq safely JSON-encodes the full prompt (handles special chars, newlines, etc.)
          jq -Rs \
            '{contents:[{parts:[{text:.}]}]}' \
            prompt.txt \
            > body.json

          # SECURITY: API key is passed as a header, NOT in the URL query string,
          # to prevent it from appearing in runner logs or network proxies.
          MAX_RETRIES=3
          RETRY_COUNT=0
          HTTP_STATUS=0

          while [ $RETRY_COUNT -le $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl \
              -s \
              -o response.json \
              -w "%{http_code}" \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -d @body.json)

            echo "Gemini HTTP status: ${HTTP_STATUS}"

            if [ "$HTTP_STATUS" == "200" ]; then
              break
            elif [ "$HTTP_STATUS" == "503" ] || [ "$HTTP_STATUS" == "429" ]; then
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "Max retries reached. Failing."
                break
              fi
              echo "API is busy or rate limited. Retrying in 10 seconds..."
              sleep 10
              RETRY_COUNT=$((RETRY_COUNT+1))
            else
              # Stop retrying on other errors (like 400 Bad Request)
              break
            fi
          done

          # Fail fast so the workflow errors cleanly instead of posting "null" as a review
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Gemini API error response:"
            cat response.json
            exit 1
          fi

          # Log token usage for cost/observability tracking
          echo "Token usage:"
          jq '.usageMetadata' response.json

          # Extract the generated review text
          jq -r \
            '.candidates[0].content.parts[0].text' \
            response.json \
            > review.md

      # ── 4. Update PR Description ────────────────────────────────────────────
      - name: Update PR Description
        if: steps.gemini.outcome == 'success'
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const newReviewBody = fs.readFileSync('review.md', 'utf8');

            const MARKER_START = '<!-- ai-pr-review-start -->';
            const MARKER_END = '<!-- ai-pr-review-end -->';

            const sha   = context.sha.slice(0, 7);
            const runAt = new Date().toUTCString();
            const issue_number = parseInt(process.env.PR_NUMBER, 10);

            // Fetch the current PR details to get the existing body
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
            });

            let currentBody = pr.body || '';
            let newBody = '';

            // The block we want to insert
            const aiBlock = `\n\n${MARKER_START}\n---\n### 🤖 AI PR Review *(Updated at ${runAt} — ${sha})*\n\n${newReviewBody}\n${MARKER_END}`;

            // Check if we already have an AI review in the description
            if (currentBody.includes(MARKER_START) && currentBody.includes(MARKER_END)) {
              // Replace the existing AI block with the new one
              const regex = new RegExp(`${MARKER_START}[\\s\\S]*?${MARKER_END}`, 'g');
              newBody = currentBody.replace(regex, aiBlock.trim());
            } else {
              // Append to the bottom of the existing description
              newBody = currentBody + aiBlock;
            }

            // Update the PR description
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
              body: newBody
            });
