name: "Terraform Plan"

on:
  pull_request:
    paths:
      - "terraform/environments/**"
      - "terraform/**/*.tf"

permissions:
  contents: read
  id-token: write    # Required for Workload Identity Federation token exchange
  pull-requests: write # Required to post plan output as a PR comment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_VERSION: "~1.7"

jobs:
  terraform-plan-non-prod:
    name: "Plan — Non-Prod"
    runs-on: ubuntu-latest
    environment: Development

    defaults:
      run:
        working-directory: terraform/environments/non-prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Non-Prod)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -reconfigure

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan Summary as PR Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.existsSync('terraform/environments/non-prod/plan_output.txt')
              ? fs.readFileSync('terraform/environments/non-prod/plan_output.txt', 'utf8')
              : '(no output)';

            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n... (truncated)'
              : planOutput;

            const fmtIcon   = '${{ steps.fmt.outcome }}'      === 'success' ? '✅' : '⚠️';
            const initIcon  = '${{ steps.init.outcome }}'     === 'success' ? '✅' : '❌';
            const valIcon   = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const planIcon  = '${{ steps.plan.outcome }}'     === 'success' ? '✅' : '❌';

            const body = `## 🏗️ Terraform Plan — Non-Prod

            | Step | Status |
            |------|--------|
            | Format | ${fmtIcon} \`${{ steps.fmt.outcome }}\` |
            | Init   | ${initIcon} \`${{ steps.init.outcome }}\` |
            | Validate | ${valIcon} \`${{ steps.validate.outcome }}\` |
            | Plan   | ${planIcon} \`${{ steps.plan.outcome }}\` |

            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            > ⚠️ **Apply is always manual.** Run \`scripts/terraform-apply.sh --env=non-prod\` locally after reviewing this plan.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
